<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14120f" />
    <title>Dungeon Warden</title>
    <!-- Preloaded so the boot text below (painted before src/index.css's
         @font-face is discovered) has a chance to land in Pretendard
         instead of the fallback — this is the very first thing a player
         sees. Bold isn't preloaded: it's not needed until the app mounts. -->
    <link
      rel="preload"
      href="/src/assets/fonts/Pretendard-Regular.subset.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #14120f;
        color: #efe7d8;
        font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      /* Shown until React mounts. The 3D scene and its models take a moment,
         and a black rectangle reads as a broken embed. Sized to match the
         scale in src/index.css (--fs-md / --fw-bold / --ls-wider,
         --fs-sm) rather than the CSS variables themselves — this markup has
         to render correctly before that stylesheet has loaded. */
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #14120f;
      }

      .boot-title {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.12em;
      }

      .boot-sub {
        font-size: 13px;
        color: #a4998a;
      }
    </style>
    <script>
      // Verse8 embeds the game in an iframe and asks it how tall it is.
      // Without this the shell cannot size the frame correctly.
      (function () {
        var lastWidth = -1;
        var lastHeight = -1;

        function reportGameSize(force) {
          var height = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
          var width = Math.max(document.body.scrollWidth, document.documentElement.scrollWidth);

          // The shell sizes the frame from this message, which resizes us in
          // turn. Reporting only real changes keeps that from ping-ponging.
          if (force !== true && width === lastWidth && height === lastHeight) return;
          lastWidth = width;
          lastHeight = height;

          window.parent.postMessage(
            { type: 'GAME_SIZE_RESPONSE', height: height, width: width },
            '*',
          );
        }

        window.addEventListener('load', function () { reportGameSize(true); });
        window.addEventListener('resize', function () { reportGameSize(false); });
        window.addEventListener('message', function (event) {
          if (event.data && event.data.type === 'REQUEST_GAME_SIZE') {
            reportGameSize(true);
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot-title">DUNGEON WARDEN</div>
        <div class="boot-sub" id="boot-sub">Preparing the dungeon…</div>
      </div>
    </div>
    <script>
      // Shown before the bundle loads, so it cannot use the React translator.
      if ((navigator.language || "").toLowerCase().startsWith("ko")) {
        document.getElementById("boot-sub").textContent = "던전을 준비하는 중…";
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
